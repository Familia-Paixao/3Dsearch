<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lua — Acompanhamento Craniano</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07090d;--surf:#0f1318;--surf2:#161b22;--surf3:#1e2530;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#dde2ec;--muted:#6b7690;--dim:#4a5168;
  --open:#4ade80;--closed:#f87171;--warn:#fbbf24;
  --lua:#c084fc;--accent:#60a5fa;--info:#38bdf8;
  --panel-w:330px;--nav-w:52px;--top-h:52px;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;}

/* ── LAYOUT DESKTOP ── */
#shell{
  display:grid;
  grid-template-columns:var(--nav-w) 1fr var(--panel-w);
  grid-template-rows:var(--top-h) 1fr;
  height:100vh;
}

/* ── TOPBAR ── */
#topbar{
  grid-column:1/-1;background:var(--surf);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 14px;
}
.moon{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 130deg,var(--lua),var(--accent));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
#topbar h1{font-family:'DM Serif Display',serif;font-size:16px;font-weight:400;white-space:nowrap;}
#topbar p{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;}
.pill{margin-left:auto;font-size:9px;color:var(--warn);border:1px solid rgba(251,191,36,0.3);padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.hdr-text{flex:1;min-width:0;}

/* ── NAV RAIL ── */
#nav{
  background:var(--surf);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px;
  z-index:10;
}
.nb{width:38px;height:38px;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;position:relative;flex-shrink:0;}
.nb:hover{background:var(--surf2);color:var(--text);}
.nb.on{background:rgba(192,132,252,0.15);color:var(--lua);}
.nb[title]:hover::after{content:attr(title);position:absolute;left:46px;background:var(--surf2);color:var(--text);font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;border:1px solid var(--border);z-index:99;font-family:'DM Sans',sans-serif;pointer-events:none;}

/* ── 3D VIEW ── */
#view{position:relative;overflow:hidden;background:var(--bg);}
#c{display:block;width:100%;height:100%;}
.hint-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);background:rgba(7,9,13,0.85);padding:4px 12px;border-radius:16px;border:1px solid var(--border);pointer-events:none;white-space:nowrap;}

/* tooltip 3D */
#tt{position:absolute;top:12px;left:12px;background:var(--surf2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:220px;z-index:10;}
#tt.on{opacity:1;}
#tt h3{font-size:12px;font-weight:500;margin-bottom:3px;}
#tt .tt-meta{font-size:10px;color:var(--accent);margin-bottom:5px;font-weight:500;}
#tt p{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:5px;}
#tt .tt-cl{font-size:10px;color:var(--dim);background:var(--surf3);padding:3px 7px;border-radius:5px;line-height:1.5;}
.st{display:inline-block;margin-top:6px;font-size:10px;padding:2px 7px;border-radius:9px;font-weight:500;}
.st.a{background:rgba(74,222,128,.15);color:var(--open);}
.st.f{background:rgba(248,113,113,.15);color:var(--closed);}
.st.w{background:rgba(251,191,36,.15);color:var(--warn);}

/* scenario bar */
#scen-bar{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(7,9,13,0.9);padding:4px;border-radius:12px;border:1px solid var(--border);z-index:5;}
.sb{background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.sb:hover{color:var(--text);}
.sb.on{border-color:var(--accent);color:var(--accent);background:rgba(96,165,250,.08);}

/* ── RIGHT PANEL ── */
#panel{background:var(--surf);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.tab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:52px;padding:9px 4px;font-size:10px;text-align:center;cursor:pointer;color:var(--muted);border:none;background:transparent;font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--lua);border-bottom-color:var(--lua);}
.pb{flex:1;overflow-y:auto;padding:12px 13px 20px;}
.ps{display:none;}
.ps.on{display:block;}
.pb::-webkit-scrollbar{width:3px;}
.pb::-webkit-scrollbar-track{background:transparent;}
.pb::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── COMPONENTS ── */
.card{background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:9px;}
.card h3{font-size:12px;font-weight:500;margin-bottom:5px;}
.card p{font-size:11px;color:var(--muted);line-height:1.6;}
.hl{color:var(--lua);} .ok{color:var(--open);} .bad{color:var(--closed);} .warn{color:var(--warn);} .info{color:var(--info);}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border);}
.kv:last-child{border:none;}
.kv span:first-child{font-size:11px;color:var(--muted);}
.kv span:last-child{font-size:11px;font-weight:500;}
.stitle{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:12px 0 6px;}

.ct{width:100%;border-collapse:collapse;font-size:10px;margin-top:5px;}
.ct th{color:var(--muted);text-align:left;padding:3px 5px;border-bottom:1px solid var(--border);font-weight:400;}
.ct td{padding:4px 5px;border-bottom:1px solid rgba(255,255,255,0.03);line-height:1.4;vertical-align:top;}
.ct tr:last-child td{border:none;}
.badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:500;white-space:nowrap;}
.bg-ok{background:rgba(74,222,128,.12);color:var(--open);}
.bg-bad{background:rgba(248,113,113,.12);color:var(--closed);}
.bg-warn{background:rgba(251,191,36,.12);color:var(--warn);}
.bg-info{background:rgba(96,165,250,.12);color:var(--accent);}

/* timeline */
.tl{position:relative;padding-left:18px;}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border2);}
.tl-item{position:relative;margin-bottom:13px;}
.tl-dot{position:absolute;left:-16px;top:3px;width:9px;height:9px;border-radius:50%;border:2px solid;}
.tl-dot.done{background:var(--open);border-color:var(--open);}
.tl-dot.now{background:var(--warn);border-color:var(--warn);box-shadow:0 0 6px rgba(251,191,36,.5);}
.tl-dot.future{background:transparent;border-color:var(--muted);}
.tl-dot.urgent{background:var(--closed);border-color:var(--closed);box-shadow:0 0 5px rgba(248,113,113,.4);}
.tl-age{font-size:10px;color:var(--accent);margin-bottom:2px;}
.tl-label{font-size:11px;font-weight:500;margin-bottom:2px;}
.tl-sub{font-size:10px;color:var(--muted);line-height:1.5;}

/* ind boxes */
.ind-box{border-radius:9px;padding:11px;margin-bottom:9px;border:1px solid;}
.ind-box.no-s{background:rgba(74,222,128,.04);border-color:rgba(74,222,128,.2);}
.ind-box.maybe{background:rgba(251,191,36,.04);border-color:rgba(251,191,36,.2);}
.ind-box.yes-s{background:rgba(248,113,113,.04);border-color:rgba(248,113,113,.2);}
.ind-box h3{font-size:12px;font-weight:500;margin-bottom:4px;}
.ind-box p{font-size:11px;color:var(--muted);line-height:1.6;}

/* refs */
.ref{border:1px solid var(--border);border-radius:7px;padding:9px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;}
.ref:hover{border-color:var(--border2);}
.ref h4{font-size:11px;font-weight:500;margin-bottom:3px;}
.ref p{font-size:10px;color:var(--muted);line-height:1.5;}
.tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:7px;background:rgba(96,165,250,.1);color:var(--accent);margin-top:3px;margin-right:2px;}
.tag.g{background:rgba(74,222,128,.1);color:var(--open);}

/* journal */
.je{border-left:2px solid var(--border2);padding:0 0 11px 11px;margin-bottom:3px;}
.je h4{font-size:12px;font-weight:500;}
.je .date{font-size:10px;color:var(--muted);margin-bottom:3px;}
.je p{font-size:11px;color:var(--muted);line-height:1.5;}
.je .attachments{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;}
.attach-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surf3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--muted);text-decoration:none;cursor:pointer;}
.attach-chip:hover{border-color:var(--accent);color:var(--accent);}
.attach-chip .ic{font-size:12px;}
.je.alert{border-left-color:var(--warn);}
.je.ok{border-left-color:var(--open);}
.je.crit{border-left-color:var(--closed);}
.je.pending{opacity:.5;}

/* form */
.add-btn{width:100%;background:transparent;border:1px dashed var(--border2);border-radius:7px;padding:9px;color:var(--muted);font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;margin-top:6px;}
.add-btn:hover{border-color:var(--lua);color:var(--lua);}
.field{width:100%;background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;margin-bottom:7px;outline:none;transition:border-color .15s;}
.field:focus{border-color:var(--border2);}
textarea.field{resize:vertical;}
.form-box{background:var(--surf2);border:1px solid var(--border2);border-radius:9px;padding:12px;margin-top:8px;display:none;}
.btn-row{display:flex;gap:6px;}
.btn{flex:1;border-radius:6px;padding:7px;font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;border:1px solid;}
.btn-pri{background:rgba(192,132,252,.15);border-color:var(--lua);color:var(--lua);}
.btn-sec{background:transparent;border-color:var(--border);color:var(--muted);}

/* drop zone */
.drop-zone{border:1px dashed var(--border2);border-radius:7px;padding:14px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:7px;position:relative;}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--lua);color:var(--lua);}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.drop-zone .icon{font-size:20px;margin-bottom:4px;}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);}
.li .dot{width:7px;height:7px;border-radius:50%;}

/* ── MOBILE BOTTOM NAV ── */
#mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--border);z-index:100;flex-direction:row;justify-content:space-around;padding:6px 0 max(6px, env(safe-area-inset-bottom));}
.mn-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;font-family:'DM Sans',sans-serif;}
.mn-btn.on{color:var(--lua);}
.mn-btn span:first-child{font-size:18px;}
.mn-btn span:last-child{font-size:8px;}

/* ── MOBILE PANEL OVERLAY ── */
#mobile-panel{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;
  background:var(--surf);border-top:1px solid var(--border2);
  border-radius:18px 18px 0 0;
  max-height:70vh;overflow:hidden;
  flex-direction:column;
  transform:translateY(100%);transition:transform .3s ease;
}
#mobile-panel.open{transform:translateY(0);}
#mobile-panel .drag-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 8px;}
#mobile-panel .mp-body{overflow-y:auto;padding:0 14px 20px;flex:1;}
#mobile-panel .mp-body::-webkit-scrollbar{display:none;}

/* ── MOBILE MEDIA QUERY ── */
@media (max-width: 768px) {
  :root{--panel-w:0px;--nav-w:0px;}
  #shell{
    grid-template-columns:1fr;
    grid-template-rows:var(--top-h) 1fr;
    height:calc(100vh - 60px);
  }
  #nav{display:none;}
  #panel{display:none;}
  #view{grid-column:1;grid-row:2;}
  #topbar{grid-column:1;}
  #mobile-nav{display:flex;}
  #mobile-panel{display:flex;}
  #topbar p{display:none;}
  .pill{display:none;}
  #topbar h1{font-size:14px;}
  #scen-bar{bottom:16px;flex-wrap:wrap;justify-content:center;max-width:95vw;}
  .sb{font-size:9px;padding:4px 8px;}
  .hint-bar{font-size:9px;bottom:68px;}
  #tt{max-width:180px;font-size:10px;}
}

@media (min-width: 769px) and (max-width: 1024px) {
  :root{--panel-w:280px;}
}
</style>
</head>
<body>
<div id="shell">

<header id="topbar">
  <div class="moon">🌙</div>
  <div class="hdr-text">
    <h1>Lua Paixão — Acompanhamento Craniano</h1>
    <p>Nascida 15/06/2025 · 9 meses · Craniossinostose Metópica em investigação</p>
  </div>
  <span class="pill">⚠ Ilustrativo</span>
</header>

<nav id="nav">
  <button class="nb on" title="Visualização 3D" onclick="setNav(0,this)">🧠</button>
  <button class="nb" title="Suturas e Fontanelas" onclick="setNav(1,this)">🦴</button>
  <button class="nb" title="Cirurgia" onclick="setNav(2,this)">🔬</button>
  <button class="nb" title="Projeção de crescimento" onclick="setNav(3,this)">📈</button>
  <button class="nb" title="Referências" onclick="setNav(4,this)">📚</button>
  <button class="nb" title="Diário" onclick="setNav(5,this)">📝</button>
</nav>

<div id="view">
  <canvas id="c"></canvas>
  <div id="tt">
    <h3 id="tt-t"></h3>
    <div class="tt-meta" id="tt-m"></div>
    <p id="tt-d"></p>
    <div class="tt-cl" id="tt-c"></div>
    <span class="st" id="tt-s"></span>
  </div>
  <div id="scen-bar">
    <button class="sb on" onclick="setScen(0,this)">Situação atual</button>
    <button class="sb" onclick="setScen(1,this)">Expansão compensatória</button>
    <button class="sb" onclick="setScen(2,this)">Pós-cirurgia</button>
  </div>
  <div class="hint-bar" id="hint">Arrastar · Scroll zoom · Toque nas suturas</div>
</div>

<!-- DESKTOP PANEL -->
<div id="panel">
  <div class="tab-bar">
    <button class="tab on" onclick="setTab(0,this)">Situação</button>
    <button class="tab" onclick="setTab(1,this)">Suturas</button>
    <button class="tab" onclick="setTab(2,this)">Cirurgia</button>
    <button class="tab" onclick="setTab(3,this)">Projeção</button>
    <button class="tab" onclick="setTab(4,this)">Refs</button>
    <button class="tab" onclick="setTab(5,this)">Diário</button>
  </div>
  <div class="pb" id="desktop-panel-body">
    <!-- content injected by renderPanel() -->
  </div>
</div>

</div><!-- /shell -->

<!-- MOBILE BOTTOM NAV -->
<nav id="mobile-nav">
  <button class="mn-btn on" onclick="mobileNav(0,this)"><span>🧠</span><span>3D</span></button>
  <button class="mn-btn" onclick="mobileNav(1,this)"><span>🦴</span><span>Suturas</span></button>
  <button class="mn-btn" onclick="mobileNav(2,this)"><span>🔬</span><span>Cirurgia</span></button>
  <button class="mn-btn" onclick="mobileNav(3,this)"><span>📈</span><span>Projeção</span></button>
  <button class="mn-btn" onclick="mobileNav(4,this)"><span>📚</span><span>Refs</span></button>
  <button class="mn-btn" onclick="mobileNav(5,this)"><span>📝</span><span>Diário</span></button>
</nav>

<!-- MOBILE PANEL SHEET -->
<div id="mobile-panel">
  <div class="drag-handle"></div>
  <div class="mp-body" id="mobile-panel-body">
    <!-- content injected -->
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ══════════════════════════════════════════════
   PANEL CONTENT
══════════════════════════════════════════════ */
const PANELS = [
  // 0 - Situação
  ()=>`
  <div class="legend">
    <div class="li"><div class="dot" style="background:var(--open)"></div>Aberta</div>
    <div class="li"><div class="dot" style="background:var(--closed)"></div>Fechada</div>
    <div class="li"><div class="dot" style="background:var(--warn)"></div>Fontanela precoce</div>
  </div>
  <div class="card">
    <h3>Perímetro cefálico</h3>
    <div style="display:flex;align-items:baseline;gap:6px;margin:5px 0 3px;">
      <span style="font-family:'DM Serif Display',serif;font-size:26px;color:var(--lua);">41</span>
      <span style="font-size:12px;color:var(--muted);">cm</span>
    </div>
    <p class="warn">Abaixo do P3 OMS para 9 meses (P3 = 41,3 cm)</p>
    <p style="margin-top:3px;font-size:10px;color:var(--dim);">Medido mar/2026 · Mediana OMS: 43,8 cm</p>
  </div>
  <div class="card">
    <h3>Suturas — laudo fev/2026</h3>
    <div class="kv"><span>Metópica</span><span class="bad">Fusão completa ✗</span></div>
    <div class="kv"><span>Fontanela anterior</span><span class="warn">Fechada precoce ⚠</span></div>
    <div class="kv"><span>Sagital</span><span class="ok">Aberta ✓</span></div>
    <div class="kv"><span>Coronal D + E</span><span class="ok">Abertas ✓</span></div>
    <div class="kv"><span>Lambdoide D + E</span><span class="ok">Abertas ✓</span></div>
  </div>
  <div class="card" style="border-color:rgba(251,191,36,.2);background:rgba(251,191,36,.04);">
    <h3 class="warn">A questão central</h3>
    <p>A TC 3D vai revelar se há <strong style="color:var(--text)">trigonocefalia significativa</strong>. Sem deformidade → cirurgia pode não ser indicada. Com deformidade moderada/grave → janela antes dos 12 meses ainda aberta.</p>
  </div>`,

  // 1 - Suturas
  ()=>`
  <div class="card"><h3>Suturas cranianas</h3><p>Junções fibrosas entre os ossos do crânio. Funcionam como centros de crescimento — o osso cresce perpendicular à sutura, empurrado pelo cérebro. Flexíveis nos bebês, ossificam gradualmente.</p></div>
  <div class="card"><h3>Fontanelas ("molinho")</h3><p>Regiões membranosas onde múltiplas suturas se encontram. Mais amplas e macias ao toque. Permitem deformação do crânio no parto e expansão rápida do cérebro no 1º ano.</p></div>
  <div class="card" style="background:rgba(96,165,250,.04);border-color:rgba(96,165,250,.15);">
    <h3 class="info">Analogia</h3>
    <p><strong style="color:var(--text)">Suturas = ruas</strong> finas entre blocos. <strong style="color:var(--text)">Fontanelas = praças</strong> onde várias ruas se encontram. Ambas permitem crescimento, mas as praças são maiores e visíveis.</p>
  </div>
  <p class="stitle">Período de fechamento normal</p>
  <div class="card" style="padding:7px;">
    <table class="ct">
      <thead><tr><th>Estrutura</th><th>Fecha</th><th>Lua</th></tr></thead>
      <tbody>
        <tr><td><strong>Fontanela posterior</strong><br><span style="color:var(--dim);font-size:9px;">Sagital + lambdoide</span></td><td>6–8 sem.</td><td><span class="badge bg-ok">Normal</span></td></tr>
        <tr><td><strong>Fontanela esfenoidal</strong></td><td>~6 meses</td><td><span class="badge bg-info">N/A</span></td></tr>
        <tr><td><strong>Sutura metópica ★</strong><br><span style="color:var(--dim);font-size:9px;">Única a fechar na infância</span></td><td>6–9 meses</td><td><span class="badge bg-warn">8m ⚠</span></td></tr>

const STORAGE_KEY = 'lua_cranio_journal_v4';
let pendingFiles = [];

function loadJournal() {

}

function saveJournal(entries) {

}

const DEFAULT_ENTRIES = [
  {id:'d1',date:'Out/2025 · 4 meses',title:'USG Suturas — Delboni Itaim Bibi',type:'ok',body:'Metópica fechada — usual para faixa etária. Demais suturas abertas. Fontanela não mencionada. Laudo: dentro da normalidade.',files:[],link:''},

  {id:'d4',date:'Abr/2026 · 9 meses',title:'1ª Consulta neurocirurgião',type:'',body:'Avaliação preliminar: possível impacto apenas estético. Sem evidência neurológica confirmada. Solicitou TC com reconstrução 3D.',files:[],link:''},
  {id:'d5',date:'Em breve · ~9–10 meses',title:'TC com reconstrução 3D + retorno neuro',type:'pending',body:'Guia a ser retirado. TC vai definir grau da deformidade (leve/moderado/grave) e orientar decisão cirúrgica.',files:[],link:''},
];

function initJournal() {
  if (!localStorage.getItem(STORAGE_KEY)) {
    saveJournal(DEFAULT_ENTRIES);
  }
}

function renderJournal(container) {
  const entries = loadJournal();
  container.innerHTML = '';
  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'je' + (e.type === 'ok' ? ' ok' : e.type === 'alert' ? ' alert' : e.type === 'crit' ? ' crit' : e.type === 'pending' ? ' pending' : '');
    let filesHtml = '';
    if (e.files && e.files.length) {
      filesHtml = '<div class="attachments">' + e.files.map(f =>
        `<span class="attach-chip"><span class="ic">${fileIcon(f.type)}</span>${f.name}</span>`
      ).join('') + '</div>';
    }
    let linkHtml = e.link ? `<div style="margin-top:5px;"><a href="${e.link}" target="_blank" class="attach-chip" style="text-decoration:none;"><span class="ic">🔗</span>${truncate(e.link,40)}</a></div>` : '';
    div.innerHTML = `<div class="date">${e.date}</div><h4>${e.title}</h4><p>${e.body}</p>${filesHtml}${linkHtml}`;
    container.appendChild(div);
  });
}

function fileIcon(type) {
  if (!type) return '📄';
  if (type.includes('pdf')) return '📄';
  if (type.includes('image')) return '🖼️';
  if (type.includes('word') || type.includes('docx')) return '📝';
  return '📎';
}

function truncate(s, n) { return s.length > n ? s.slice(0,n)+'…' : s; }

function handleFiles(fileList) {
  const preview = document.getElementById('file-preview');
  if (!preview) return;
  Array.from(fileList).forEach(f => {
    pendingFiles.push({ name: f.name, type: f.type, size: f.size });
    const chip = document.createElement('span');
    chip.className = 'attach-chip';
    chip.innerHTML = `<span class="ic">${fileIcon(f.type)}</span>${f.name}`;
    preview.appendChild(chip);
  });
  // drag-over highlight
  const dz = document.getElementById('drop-zone');
  if (dz) dz.classList.remove('drag-over');
}

function showJournalForm() {
  const f = document.getElementById('jform');
  if (f) { f.style.display = 'block'; pendingFiles = []; }
  const fp = document.getElementById('file-preview');
  if (fp) fp.innerHTML = '';
}
function cancelJournalForm() {
  const f = document.getElementById('jform');
  if (f) f.style.display = 'none';
  pendingFiles = [];
}

function saveJournalEntry() {
  const date = document.getElementById('j-date')?.value?.trim();
  const title = document.getElementById('j-title')?.value?.trim();
  const type = document.getElementById('j-type')?.value || '';
  const body = document.getElementById('j-body')?.value?.trim();
  const link = document.getElementById('j-link')?.value?.trim();
  if (!title) return;
  const entries = loadJournal();
  entries.push({ id: 'u' + Date.now(), date, title, type, body, files: [...pendingFiles], link });
  saveJournal(entries);
  cancelJournalForm();
  refreshCurrentPanel();
}

// Virchow's law: growth parallel to fused suture, restricted perpendicular
// For metopic: frontal width restricted, AP and vertical compensate
// Based on: Jin et al. (Western Univ), Porras et al. (Children's Colorado),
//           Nature Scientific Reports 2023 data-driven suture growth model

const GROWTH_MODEL = {
  // Metopic closed + anterior fontanelle closed, 5 sutures open
  // Growth vectors as % deviation from normal at each age (months)
  // [frontalWidth, APLength, height, temporalWidth]
  withoutSurgery: {
    // Restricted frontal expansion, compensatory AP and lateral growth
    9:  { fw: -18, ap: +8,  ht: +5,  tw: +12 },
    12: { fw: -22, ap: +10, ht: +6,  tw: +15 },
    18: { fw: -25, ap: +11, ht: +7,  tw: +17 },
    24: { fw: -26, ap: +11, ht: +7,  tw: +18 },
    36: { fw: -24, ap: +10, ht: +6,  tw: +16 },
    60: { fw: -20, ap: +8,  ht: +5,  tw: +13 },
  },
  withSurgery: {
    // After FOA: frontal expansion restored, gradual normalization
    9:  { fw: -18, ap: +8,  ht: +5,  tw: +12 }, // pre-op baseline
    12: { fw: -5,  ap: +3,  ht: +2,  tw: +4  }, // 3m post-op
    18: { fw: +2,  ap: +1,  ht: +1,  tw: +2  },
    24: { fw: +3,  ap: 0,   ht: 0,   tw: +1  },
    36: { fw: +2,  ap: 0,   ht: 0,   tw: 0   },
    60: { fw: +1,  ap: 0,   ht: 0,   tw: 0   },
  },
  // Normal skull growth baseline (OMS + literature)
  // Approx frontal angle (IFDA degrees) by severity
  ifda: {
    normal: 137,
    mild: 126,
    moderate: 116,
    severe: 104,
  }
};

// Map IFDA to severity label
function ifdaToSeverity(ifda) {
  if (!ifda) return null;
  if (ifda >= 130) return 'leve';
  if (ifda >= 120) return 'moderado';
  return 'grave';
}

function severityColor(s) {
  if (s === 'leve') return '#4ade80';
  if (s === 'moderado') return '#fbbf24';
  return '#f87171';
}

// SVG skull shape generator — top-down view
// Returns SVG path string for approximate skull outline given growth params
function skullTopPath(params, cx, cy, baseR) {
  const { fw, ap, tw } = params;
  const rx = baseR * (1 + tw / 100);     // lateral (transverse)
  const ryFront = baseR * 0.85 * (1 + fw / 100) * 0.6; // frontal projection
  const ryBack  = baseR * 1.1 * (1 + ap / 100);         // occipital
  // Draw simplified top-down skull: ellipse-like with frontal narrowing for metopic
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    let r;
    if (a < 0) {
      // front half
      const t = (a + Math.PI / 2) / (Math.PI / 2);
      r = ryFront + (rx - ryFront) * Math.abs(Math.sin(a));
    } else {
      r = ryBack + (rx - ryBack) * Math.abs(Math.sin(a));
    }
    const x = cx + Math.cos(a) * rx;
    const y = cy + Math.sin(a) * (a < 0 ? ryFront : ryBack);
    pts.push(`${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return pts.join(' ') + ' Z';
}

// SVG skull front view shape
function skullFrontPath(params, cx, cy, w, h) {
  const { fw, ht } = params;
  const hw = (w / 2) * (1 + fw / 100);
  const hh = (h / 2) * (1 + ht / 100);
  // Simplified front view: wider top, narrower bottom (face)
  return `M${cx},${cy - hh} C${cx + hw},${cy - hh} ${cx + hw * 1.1},${cy} ${cx + hw * 0.7},${cy + hh * 0.7} L${cx},${cy + hh * 0.9} L${cx - hw * 0.7},${cy + hh * 0.7} C${cx - hw * 1.1},${cy} ${cx - hw},${cy - hh} ${cx},${cy - hh} Z`;
}

function renderProjection(container) {
  const ct = loadCT();
  const severity = ct ? ifdaToSeverity(ct.ifda) : null;
  const sevColor = severity ? severityColor(severity) : '#6b7690';

  // Ages to show in chart
  const ages = [9, 12, 18, 24, 36, 60];
  const ageLabels = ['9m', '12m', '18m', '2a', '3a', '5a'];

  // Build PC projection (simplified: normal growth rate adjusted by severity)
  const pcNormal   = [43.8, 44.9, 46.5, 47.6, 48.6, 50.0];
  const pcNoSurg   = [41.0, 41.8, 43.0, 43.8, 44.5, 45.5]; // restricted growth
  const pcWithSurg = [41.0, 42.5, 44.8, 46.5, 48.0, 49.5]; // restored

  // SVG chart dimensions
  const W = 280, H = 130, pad = { l:32, r:10, t:10, b:22 };
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  const minPC = 39, maxPC = 52;

  function pcToY(pc) { return pad.t + cH - ((pc - minPC) / (maxPC - minPC)) * cH; }
  function idxToX(i) { return pad.l + (i / (ages.length - 1)) * cW; }

  function polyline(arr, color, dash='') {
    const pts = arr.map((v,i) => `${idxToX(i).toFixed(1)},${pcToY(v).toFixed(1)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
  }
  function dots(arr, color) {
    return arr.map((v,i) => `<circle cx="${idxToX(i).toFixed(1)}" cy="${pcToY(v).toFixed(1)}" r="3" fill="${color}" stroke="var(--bg)" stroke-width="1.5"/>`).join('');
  }

  // Skull silhouette SVGs (top-down view, simplified)
  function skullSVG(params, label, labelColor, note) {
    const cx = 60, cy = 55, baseR = 38;
    const rx = baseR * (1 + (params.tw||0) / 100);
    const ryF = baseR * 0.7 * (1 + (params.fw||0) / 100);
    const ryB = baseR * 1.05 * (1 + (params.ap||0) / 100);

    // Generate points for top-down skull
    const nPts = 80;
    const points = [];
    for (let i = 0; i <= nPts; i++) {
      const a = (i / nPts) * Math.PI * 2;
      // Front = top of SVG (a near PI), back = bottom (a near 0)
      const isFront = Math.cos(a) > 0;
      const x = cx + Math.sin(a) * rx;
      const y = cy + (isFront ? -Math.abs(Math.cos(a)) * ryF : Math.abs(Math.cos(a)) * ryB);
      points.push(`${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`);
    }
    const path = points.join(' ') + ' Z';

    // Metopic line (vertical, front center)
    const mTop = `${cx},${cy - ryF}`;
    const mBot = `${cx},${cy - ryF * 0.3}`;

    return `
    <svg width="120" height="120" viewBox="0 0 120 120" style="overflow:visible;">
      <defs>
        <radialGradient id="sg${label.replace(/\s/g,'')}" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="${labelColor}" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="${labelColor}" stop-opacity="0.05"/>
        </radialGradient>
      </defs>
      <path d="${path}" fill="url(#sg${label.replace(/\s/g,'')})" stroke="${labelColor}" stroke-width="2" opacity="0.9"/>
      <!-- Suturas abertas -->
      <line x1="${cx}" y1="${cy+ryB*0.1}" x2="${cx}" y2="${cy+ryB}" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
      <!-- Coronais -->
      <path d="M${cx-rx*0.5},${cy-ryF*0.4} Q${cx},${cy-ryF*0.6} ${cx+rx*0.5},${cy-ryF*0.4}" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
      <!-- Lambdoides -->
      <path d="M${cx-rx*0.6},${cy+ryB*0.3} Q${cx},${cy+ryB*0.55} ${cx+rx*0.6},${cy+ryB*0.3}" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>
      <!-- Metópica fechada -->
      <line x1="${cx}" y1="${cy-ryF}" x2="${cx}" y2="${cy-ryF*0.2}" stroke="#f87171" stroke-width="2.5" stroke-dasharray="4,2"/>
      <!-- Labels -->
      <text x="${cx}" y="108" text-anchor="middle" fill="${labelColor}" font-size="10" font-family="DM Sans,sans-serif" font-weight="500">${label}</text>
      <text x="${cx}" y="118" text-anchor="middle" fill="#4a5168" font-size="8" font-family="DM Sans,sans-serif">${note}</text>
      <!-- Front/back labels -->
      <text x="${cx}" y="10" text-anchor="middle" fill="#60a5fa" font-size="7" font-family="DM Sans,sans-serif">FRENTE</text>
      <text x="${cx}" y="98" text-anchor="middle" fill="#4ade80" font-size="7" font-family="DM Sans,sans-serif">TRÁS</text>

window.saveCTData = function() {
  const ifda = parseFloat(document.getElementById('ct-ifda')?.value);
  const vol  = parseFloat(document.getElementById('ct-vol')?.value) || null;
  const thick = parseFloat(document.getElementById('ct-thick')?.value) || null;
  if (!ifda || isNaN(ifda)) { alert('Por favor insira o IFDA (ângulo interfrontal)'); return; }
  const severity = ifdaToSeverity(ifda);
  const data = { ifda, vol, thick, severity,
    date: new Date().toLocaleDateString('pt-BR', {month:'short',year:'numeric'}) };
  saveCT(data);
  refreshCurrentPanel();
};

let currentTab = 0;

function renderPanel(idx, container) {
  if (idx === 3) {
    renderProjection(container);
    return;
  }
  // PANELS: 0=situação,1=suturas,2=cirurgia, then 4=refs→PANELS[3], 5=diário→PANELS[4]
  const panelIdx = idx <= 2 ? idx : idx - 1;
  container.innerHTML = PANELS[panelIdx]();
  if (idx === 5) {
    const jl = container.querySelector('#journal-list');
    if (jl) renderJournal(jl);
    const dz = container.querySelector('#drop-zone');
    if (dz) {
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
      dz.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });
    }
  }
}

function refreshCurrentPanel() {
  const desktop = document.getElementById('desktop-panel-body');
  if (desktop && window.innerWidth > 768) renderPanel(currentTab, desktop);
  const mobile = document.getElementById('mobile-panel-body');
  if (mobile && window.innerWidth <= 768) renderPanel(currentTab, mobile);
}

function setNav(i, btn) {
  currentTab = i;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tab')[i]?.classList.add('on');
  const body = document.getElementById('desktop-panel-body');
  if (body) renderPanel(i, body);
}

function setTab(i, btn) {
  currentTab = i;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.nb').forEach((b,j)=>b.classList.toggle('on',j===i));
  const body = document.getElementById('desktop-panel-body');
  if (body) renderPanel(i, body);
}

function mobileNav(i, btn) {
  currentTab = i;
  document.querySelectorAll('.mn-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const mp = document.getElementById('mobile-panel');
  const body = document.getElementById('mobile-panel-body');
  if (i === 0) {
    mp.classList.remove('open');
  } else {
    renderPanel(i, body);
    mp.classList.add('open');
  }
}

const mp = document.getElementById('mobile-panel');

function textSprite(text, color, scale=1.1) {
  const c = document.createElement('canvas');
  c.width=300; c.height=68;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,300,68);
  ctx.fillStyle='rgba(7,9,13,0.72)';
  ctx.beginPath(); ctx.roundRect(8,12,284,44,20); ctx.fill();
  ctx.strokeStyle=color+'55'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(8,12,284,44,20); ctx.stroke();
  ctx.font='bold 26px "DM Sans",sans-serif';
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, 150, 36);
  const mat = new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthTest:false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(scale, scale*0.26, 1);
  return sp;
}

function sphPt(tDeg,pDeg,r=1.036) {
  const t=tDeg*Math.PI/180, p=pDeg*Math.PI/180;
  return new THREE.Vector3(Math.sin(p)*Math.sin(t)*r, Math.cos(p)*r*1.15, Math.sin(p)*Math.cos(t)*r*1.1);
}
function mkLine(pts,color,dashed=false) {
  const geo=new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3(pts,false,'centripetal').getPoints(120));
  const mat=dashed?new THREE.LineDashedMaterial({color,dashSize:.06,gapSize:.04}):new THREE.LineBasicMaterial({color});
  const line=new THREE.Line(geo,mat);
  if(dashed)line.computeLineDistances();
  return line;
}

function buildSutures() {
  SUTURES.forEach(s=>{
    const line=mkLine(s.pts.map(([t,p])=>sphPt(t,p)),s.color,s.dashed);
    line.userData=s; group.add(line); sutureLines.push(line);
  });
}

function showTT(obj) {
  const d=obj.userData;
  document.getElementById('tt-t').textContent=d.name;
  document.getElementById('tt-m').textContent=d.meta||'';
  document.getElementById('tt-d').textContent=d.desc;
  document.getElementById('tt-c').textContent=d.closure||'';
  const ts=document.getElementById('tt-s');
  if(d.status==='aberta'){ts.textContent='Aberta ✓';ts.className='st a';}
  else if(d.status==='fechada'){ts.textContent='Fechada — fusão completa ✗';ts.className='st f';}
  else{ts.textContent='Fechada precocemente ⚠';ts.className='st w';}
  tt.classList.add('on');
}
function hideTT(){tt.classList.remove('on');}

// Orbit
let drag=false, rotX=0.1, rotY=0, zoom=5.6, px=0, py=0;
canvas.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.style.cursor='grabbing';});
window.addEventListener('mouseup',()=>{drag=false;canvas.style.cursor='grab';});
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  if(drag){
    rotY+=(e.clientX-px)*.007; rotX+=(e.clientY-py)*.007;
    rotX=Math.max(-1.3,Math.min(1.3,rotX)); px=e.clientX; py=e.clientY; hideTT();
  } else {
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(getInteractables(),false);
    if(hits.length){showTT(hits[0].object);canvas.style.cursor='pointer';}
    else{hideTT();canvas.style.cursor='grab';}
  }
});
canvas.addEventListener('wheel',e=>{zoom=Math.max(2.8,Math.min(9,zoom+e.deltaY*.005));},{passive:true});

// Touch orbit
let lt=null, lt2=null, initPinchDist=null;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;lt=e.touches[0];lt2=null;}
  if(e.touches.length===2){drag=false;lt2=e.touches;initPinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
canvas.addEventListener('touchend',e=>{drag=false;lt=null;lt2=null;initPinchDist=null;},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&drag&&lt){
    const t=e.touches[0];
    rotY+=(t.clientX-lt.clientX)*.009; rotX+=(t.clientY-lt.clientY)*.009;
    rotX=Math.max(-1.3,Math.min(1.3,rotX)); lt=t; hideTT();
  }
  if(e.touches.length===2&&initPinchDist){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const delta=(initPinchDist-d)*0.02;
    zoom=Math.max(2.8,Math.min(9,zoom+delta));
    initPinchDist=d;
  }
  e.preventDefault();
},{passive:false});

// tap to identify suture on mobile
canvas.addEventListener('click',e=>{
  if(drag)return;
  const r=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  if(!raycaster||!camera)return;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(getInteractables(),false);
  if(hits.length) showTT(hits[0].object);
  else hideTT();
});

window.setScen=function(n,btn){
  document.querySelectorAll('.sb').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  if(!group)return;
  if(arrowGrp) arrowGrp.visible=n===1;
  if(expSkull) expSkull.visible=n===2;
  if(skull){ skull.material.opacity=n===2?.12:.20; skull.material.color.setHex(n===2?0x1a5080:0x7c6bb0); }
  sutureLines.forEach(l=>{const d=l.userData;l.material.color.setHex(n===1&&d.status==='aberta'?0x86efac:d.color);});
};

function resize3D(){
  if(!renderer||!camera)return;
  const w=viewEl.clientWidth||window.innerWidth, h=viewEl.clientHeight||400;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize3D).observe(viewEl);

let T=0;
function animate(){
  requestAnimationFrame(animate); T+=.016;
  if(!renderer||!scene||!camera||!group)return;
  group.rotation.x=rotX; group.rotation.y=rotY+(drag?0:T*.0025);
  camera.position.z=zoom;
  if(fontMesh){ const p=.88+.12*Math.sin(T*2.8); fontMesh.scale.setScalar(p); }
  if(ringMesh){ ringMesh.scale.setScalar(.9+.2*Math.sin(T*2.8)); }
  if(ringMat){ ringMat.opacity=.22+.32*Math.sin(T*2.8); }
  if(fill){ fill.position.set(-2+Math.sin(T*.4)*.5,1,3+Math.cos(T*.4)*.4); }
  renderer.render(scene,camera);
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
initJournal();
renderPanel(0, document.getElementById('desktop-panel-body'));

// Defer 3D init to after layout is painted
window.addEventListener('load', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      try {
        init3D();
        build3DScene();
        resize3D();
        animate();
      } catch(e) {
        console.error('3D init failed:', e);
        viewEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6b7690;font-size:13px;text-align:center;padding:20px;">Visualização 3D indisponível.<br>Todas as outras abas funcionam normalmente.</div>';
      }
    });
  });
});
</script>
